
# Identificação
sonar.projectName=Aori
sonar.sourceEncoding=UTF-8

# Código-fonte
sonar.sources=public,scripts
sonar.inclusions=public/**/*.js,scripts/**/*.mjs

# Testes
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.mjs

# Cobertura
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Histórico Git
sonar.scm.provider=git
