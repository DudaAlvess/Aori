
name: Qualidade e SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes, cobertura e SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm ci    

      - name: Verificar sintaxe
        run: npm run check

      - name: Executar testes e gerar cobertura
        run: |
          npx --yes c8@12.0.0 \
            --all \
            --include='public/**/*.js' \
            --include='scripts/**/*.mjs' \
            --exclude='tests/**' \
            --reporter=lcov \
            --reporter=text \
            npm test

      - name: Verificar relatório de cobertura
        run: test -s coverage/lcov.info

      - name: Verificar configuração do SonarCloud
        id: sonar-config
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [[ -n "$SONAR_TOKEN" &&
                -n "$SONAR_ORGANIZATION" &&
                -n "$SONAR_PROJECT_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Configure as credenciais do SonarCloud."
          fi

      - name: Analisar no SonarCloud
        if: steps.sonar-config.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
